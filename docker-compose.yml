services:
  # Django Backend Service
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: travel-agency-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Server:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:3000
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-your-email@gmail.com}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-your-16-char-app-password}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-your-email@gmail.com}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}

    working_dir: /app/src
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    networks:
      - travel-network


  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: travel-agency-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./Client:/app
      - node_modules_frontend:/app/node_modules
    environment:
      - BACKEND_API_URL=http://backend:8000

    command: ["npx", "ng", "serve", "--host", "0.0.0.0", "--port", "4200", "--poll", "2000"]
    depends_on:
      - backend
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  node_modules_frontend:
    driver: local
