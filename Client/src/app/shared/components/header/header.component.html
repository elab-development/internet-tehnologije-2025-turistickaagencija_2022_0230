<header class="header">
  <a routerLink="/" class="logo">
    <img src="assets/logo.png" alt="Travel logo" class="logo-img">
  </a>

  <nav class="navigation">
    <ul>
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
      <li><a routerLink="/about-us" routerLinkActive="active">About Us</a></li>
      <li><a routerLink="/faq" routerLinkActive="active">FAQ</a></li>

      <!-- Kada NEMA usera: login/sign up -->
      <ng-container *ngIf="!(user$ | async)">
        <li><a routerLink="login" class="login-link">Login</a></li>
        <li><a routerLink="signup" class="signup-link">Sign Up</a></li>
      </ng-container>

      <ng-container *ngIf="user$ | async as user">
        <li class="user-menu">
          <button class="user-button" (click)="toggleUserMenu()">
            <span class="user-avatar">{{ user.username.substring(0, 2).toUpperCase() }}</span>
            <span class="user-name">{{ user.username }}</span>
            <svg class="arrow-icon" [class.open]="userMenuOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <div class="user-dropdown" *ngIf="userMenuOpen">
            <a *ngIf="!isAdmin(user) && !isAgent(user)" routerLink="/my-bookings" class="dropdown-item" (click)="userMenuOpen = false">
              <span class="dropdown-icon">🗓️</span> My Bookings
            </a>
            <a *ngIf="isAdmin(user)" routerLink="/admin/dashboard" class="dropdown-item" (click)="userMenuOpen = false">
              <span class="dropdown-icon">🛠️</span> Dashboard
            </a>
            <a *ngIf="isAgent(user)" routerLink="/agent/dashboard" class="dropdown-item" (click)="userMenuOpen = false">
              <span class="dropdown-icon">🧭</span> Agent Dashboard
            </a>
            <button class="dropdown-item dropdown-item--danger" (click)="logout()">
              <span class="dropdown-icon">🚪</span> Logout
            </button>
          </div>
        </li>
      </ng-container>
    </ul>
  </nav>
</header>
