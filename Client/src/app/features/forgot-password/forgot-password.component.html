<div class="forgot-password">
  <h2>Reset password</h2>
  <p class="subtitle">Enter the email associated with your account.</p>

  <div *ngIf="submitted" class="success-message">
    If an account with that email exists, you will receive an email with instructions to reset your password.
  </div>

  <form *ngIf="!submitted" class="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="Enter your email" required />
    </div>

    <button class="button" type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Sending...' : 'Send reset link' }}
    </button>
  </form>
</div>
