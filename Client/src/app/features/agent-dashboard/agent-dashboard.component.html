<section class="dashboard-shell">
  <div class="dashboard-header">
    <div>
      <p class="eyebrow">Agent</p>
      <h1>Agent dashboard</h1>
    </div>
    <p class="subtitle">Manage travel arrangements offered to clients.</p>
  </div>

  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>

  <div class="management-cards-grid">
    <a class="management-card" routerLink="/agent/arrangements">
      <div class="card-icon">✈️</div>
      <div class="card-body">
        <h2>Arrangements</h2>
        <p>Add, edit, or remove travel packages</p>
      </div>
      <div class="card-footer">
        <span class="card-count">{{ arrangementsCount }} arrangements</span>
        <span class="card-arrow">→</span>
      </div>
    </a>

    <a class="management-card" routerLink="/agent/bookings">
      <div class="card-icon">🧾</div>
      <div class="card-body">
        <h2>Bookings</h2>
        <p>Review bookings for your arrangements</p>
      </div>
      <div class="card-footer">
        <span class="card-count">{{ bookingsCount }} bookings</span>
        <span class="card-arrow">→</span>
      </div>
    </a>
  </div>
</section>
