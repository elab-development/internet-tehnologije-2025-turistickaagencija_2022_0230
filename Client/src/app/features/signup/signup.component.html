<div class="sign-up">
    <h2>Sign up</h2>

    <div *ngIf="successMessage" class="success-message">
        <strong>Success!</strong> {{ successMessage }}
    </div>

    <form class="form" novalidate>
        <div class="form-group">
            <label for="username">Profile name</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Enter profile name" 
                (blur)="validateField('username')"
                (input)="validateField('username')"
                required />
            <span *ngIf="fieldErrors.username" class="error-text">{{ fieldErrors.username }}</span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input 
                type="text" 
                id="email" 
                name="email" 
                placeholder="Enter email" 
                (blur)="validateField('email')"
                (input)="validateField('email')"
                required />
            <span *ngIf="fieldErrors.email" class="error-text">{{ fieldErrors.email }}</span>
        </div>

        <div class="form-group">
            <div class="password-label">
                <label for="password">Password</label>
                <i class="fa-solid" [class.fa-eye]="!isOpen" [class.fa-eye-slash]="isOpen" (click)="toggle()">
                </i>
            </div>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                (blur)="validateField('password')"
                (input)="validateField('password')"
                required />
            <span *ngIf="fieldErrors.password" class="error-text">{{ fieldErrors.password }}</span>
        </div>

        <div class="gender">
            <label for="gender">What is your gender?</label>
        </div>
        <div class="gender-options">
            <input 
                type="radio" 
                id="male" 
                name="gender" 
                value="male"
                (change)="validateField('gender')"/>
            <label for="male">Male</label>
            <input 
                type="radio" 
                id="female" 
                name="gender" 
                value="female"
                (change)="validateField('gender')" />
            <label for="female">Female</label>
        </div>
        <span *ngIf="fieldErrors.gender" class="error-text">{{ fieldErrors.gender }}</span>

        <div class="birth-date">
            <label for="birth">What is your date of birth?</label>
            <div class="date">
                <select 
                    name="day" 
                    id="day" 
                    placeholder="Day" 
                    class="choose"
                    (change)="validateField('day')">
                    <option value="" disabled selected>Day</option>
                    <option *ngFor="let day of days" [value]="day">{{ day }}</option>
                </select>
                <select 
                    name="month" 
                    id="month" 
                    placeholder="Month" 
                    class="choose"
                    (change)="validateField('month')">
                    <option value="" disabled selected>Month</option>
                    <option *ngFor="let month of months" [value]="month">{{ month }}</option>
                </select>
                <select 
                    name="year" 
                    id="year" 
                    placeholder="Year" 
                    class="choose"
                    (change)="validateField('year')">
                    <option value="" disabled selected>Year</option>
                    <option *ngFor="let year of years" [value]="year">{{ year }}</option>
                </select>
            </div>
            <span *ngIf="fieldErrors.dateOfBirth" class="error-text">{{ fieldErrors.dateOfBirth }}</span>
        </div>

        <button class="button" type="button" [disabled]="isLoading" (click)="onSubmit($event)">
            {{ isLoading ? 'Registration in progress...' : 'Sign up' }}
        </button>
    </form>
    <div class="sign-in">
        You already have an account? <a href="login">Log in</a>.
    </div>
</div>
