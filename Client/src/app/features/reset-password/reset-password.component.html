<div class="reset-password">
  <h2>Set a new password</h2>
  <p class="subtitle">Choose a new password for your account.</p>

  <div *ngIf="success" class="success-message">{{ success }}</div>
  <div *ngIf="error" class="error-message">{{ error }}</div>

  <form *ngIf="!success" class="form" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" [(ngModel)]="newPassword" placeholder="Enter new password" required />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="Confirm new password" required />
    </div>

    <button class="button" type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Updating...' : 'Change password' }}
    </button>
  </form>
</div>
