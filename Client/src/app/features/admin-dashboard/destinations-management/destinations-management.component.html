<div class="management-container">
  <div class="header">
    <div>
      <h1>Destinations Management</h1>
      <p>Manage destinations and their country assignments.</p>
    </div>
    <button class="btn-add" (click)="toggleAddForm()">
      <span class="btn-add__icon">+</span> Add Destination
    </button>
  </div>

  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-box">{{ successMessage }}</div>

  <!-- Loading skeleton -->
  <div class="destinations-list" *ngIf="loading">
    <div class="destination-card destination-card--skeleton" *ngFor="let s of [1,2,3,4]"></div>
  </div>

  <!-- Kartice destinacija -->
  <div class="destinations-list" *ngIf="!loading">
    <div
      class="destination-card"
      *ngFor="let destination of pagedDestinations"
      [class.destination-card--expanded]="editingDestinationId === destination.id"
    >
      <div class="destination-card__row" (click)="toggleDestination(destination)">
        <div class="destination-thumb">
          <img *ngIf="destination.image" [src]="destination.image" [alt]="destination.name" />
          <span *ngIf="!destination.image">📍</span>
        </div>

        <div class="destination-main">
          <span class="destination-name">{{ destination.name }}</span>
          <span class="destination-sub">{{ destination.country.name }}</span>
        </div>

        <div class="destination-card__actions" (click)="$event.stopPropagation()">
          <button class="btn-icon btn-icon--danger" title="Delete destination" (click)="deleteDestination(destination.id, destination.name)">
            🗑
          </button>
          <button
            class="btn-expand"
            [class.btn-expand--open]="editingDestinationId === destination.id"
            (click)="toggleDestination(destination)"
            [attr.aria-expanded]="editingDestinationId === destination.id"
            title="Edit destination"
          >
            <span class="chevron">⌄</span>
          </button>
        </div>
      </div>

      <div class="destination-card__edit" *ngIf="editingDestinationId === destination.id">
        <div class="edit-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" [(ngModel)]="editFormData.name" />
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="text" [(ngModel)]="editFormData.image" />
          </div>
          <div class="form-group">
            <label>Country</label>
            <select [(ngModel)]="editFormData.country_id">
              <option value="0">Select country</option>
              <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-save" (click)="saveEdit(destination.id)">Save changes</button>
          <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && destinations.length === 0 && !errorMessage" class="empty-state">
    <p>No destinations found.</p>
  </div>

  <!-- Paginacija -->
  <div class="pagination" *ngIf="!loading && totalPages > 1">
    <button class="pagination__nav" (click)="prevPage()" [disabled]="currentPage === 1" aria-label="Previous page">
      ‹
    </button>

    <span class="pagination__label">Page <strong>{{ currentPage }}</strong> of {{ totalPages }}</span>

    <button class="pagination__nav" (click)="nextPage()" [disabled]="currentPage === totalPages" aria-label="Next page">
      ›
    </button>
  </div>
</div>

<!-- Add destination modal -->
<div class="modal-overlay" *ngIf="showAddForm" (click)="toggleAddForm()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add new destination</h2>
      <button class="modal-close" (click)="toggleAddForm()" aria-label="Close">×</button>
    </div>

    <div class="edit-form edit-form--modal">
      <div class="form-group">
        <label>Name</label>
        <input type="text" [(ngModel)]="newDestination.name" placeholder="Destination name" />
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" [(ngModel)]="newDestination.image" placeholder="Image URL" />
      </div>
      <div class="form-group">
        <label>Country</label>
        <select [(ngModel)]="newDestination.country_id">
          <option value="0">Select country</option>
          <option *ngFor="let country of countries" [value]="country.id">{{ country.name }}</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="toggleAddForm()">Cancel</button>
      <button class="btn-save" (click)="addDestination()">Create destination</button>
    </div>
  </div>
</div>
