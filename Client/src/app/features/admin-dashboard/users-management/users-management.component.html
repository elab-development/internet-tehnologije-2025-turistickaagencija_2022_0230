<div class="management-container">
  <div class="header">
    <h1>Users Management</h1>
    <button class="btn-add" (click)="openAddModal()">
      <span class="btn-add__icon">+</span> Add User
    </button>
  </div>

  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-box">{{ successMessage }}</div>

  <!-- Loading skeleton -->
  <div class="users-list" *ngIf="loading">
    <div class="user-card user-card--skeleton" *ngFor="let s of [1,2,3,4]"></div>
  </div>

  <!-- Kartice korisnika -->
  <div class="users-list" *ngIf="!loading">
    <div
      class="user-card"
      *ngFor="let user of pagedUsers"
      [class.user-card--expanded]="editingUserId === user.id"
    >
      <div class="user-card__row" (click)="toggleUser(user)">
        <div class="user-avatar">{{ getInitials(user.username) }}</div>

        <div class="user-main">
          <span class="user-name">
            <span
              class="user-status-dot"
              [class.user-status-dot--inactive]="!user.is_active"
              [attr.title]="user.is_active ? 'Active' : 'Inactive'"
              [attr.aria-label]="user.is_active ? 'Active user' : 'Inactive user'">
            </span>
            {{ user.username }}
          </span>
          <span class="user-email">{{ user.email }}</span>
        </div>

        <span [ngClass]="['badge', getRoleClass(user.role)]">{{ user.role }}</span>

        <div class="user-quick-info">
          <span class="user-quick-info__label">Phone</span>
          <span class="user-quick-info__value">{{ user.profile?.phone_number || '—' }}</span>
        </div>

        <div class="user-card__actions" (click)="$event.stopPropagation()">
          <button class="btn-icon btn-icon--danger" title="Delete user" (click)="deleteUser(user.id, user.username)">
            🗑
          </button>
          <button
            class="btn-expand"
            [class.btn-expand--open]="editingUserId === user.id"
            (click)="toggleUser(user)"
            [attr.aria-expanded]="editingUserId === user.id"
            title="Edit user"
          >
            <span class="chevron">⌄</span>
          </button>
        </div>
      </div>

      <div class="user-card__edit" *ngIf="editingUserId === user.id">
        <div class="edit-form">
          <div class="form-group">
            <label>Username</label>
            <input type="text" [(ngModel)]="editFormData.username" placeholder="Enter username" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" [(ngModel)]="editFormData.email" placeholder="Enter email" />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="editFormData.password" placeholder="Leave empty to keep current password" />
          </div>
          <div class="form-group">
            <label>Role</label>
            <select [(ngModel)]="editFormData.role">
              <option value="ADMIN">Admin</option>
              <option value="AGENT">Agent</option>
              <option value="CLIENT">Client</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" [(ngModel)]="editFormData.phone_number" />
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select [(ngModel)]="editFormData.gender">
              <option value="">Not specified</option>
              <option value="FEMALE">Female</option>
              <option value="MALE">Male</option>
              <option value="OTHER">Other</option>
              <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date of birth</label>
            <input type="date" [(ngModel)]="editFormData.date_of_birth" />
          </div>
          <div class="form-group">
            <label>Active</label>
            <select [(ngModel)]="editFormData.is_active">
              <option [ngValue]="true">True</option>
              <option [ngValue]="false">False</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-save" (click)="saveEdit(user.id)">Save changes</button>
          <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && users.length === 0 && !errorMessage" class="empty-state">
    <p>No users found.</p>
  </div>

  <!-- Paginacija -->
  <div class="pagination" *ngIf="!loading && totalPages > 1">
    <button class="pagination__nav" (click)="prevPage()" [disabled]="currentPage === 1" aria-label="Previous page">
      ‹
    </button>

    <span class="pagination__label">Page <strong>{{ currentPage }}</strong> of {{ totalPages }}</span>

    <button class="pagination__nav" (click)="nextPage()" [disabled]="currentPage === totalPages" aria-label="Next page">
      ›
    </button>
  </div>
</div>

<!-- Add user modal -->
<div class="modal-overlay" *ngIf="isAddModalOpen" (click)="closeAddModal()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add new user</h2>
      <button class="modal-close" (click)="closeAddModal()" aria-label="Close">×</button>
    </div>

    <div *ngIf="addErrors.length" class="error-box">
      <div *ngFor="let err of addErrors">{{ err }}</div>
    </div>

    <div class="edit-form edit-form--modal">
      <div class="form-group">
        <label>Username</label>
        <input type="text" [(ngModel)]="newUserFormData.username" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="newUserFormData.email" placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="newUserFormData.password" placeholder="Minimum 6 characters" />
      </div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="newUserFormData.role">
          <option value="" disabled selected>Select a role</option>
          <option value="ADMIN">Admin</option>
          <option value="AGENT">Agent</option>
          <option value="CLIENT">Client</option>
        </select>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="newUserFormData.phone_number" />
      </div>
      <div class="form-group">
        <label>Gender</label>
        <select [(ngModel)]="newUserFormData.gender">
          <option value="">Not specified</option>
          <option value="FEMALE">Female</option>
          <option value="MALE">Male</option>
          <option value="OTHER">Other</option>
          <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date of birth</label>
        <input type="date" [(ngModel)]="newUserFormData.date_of_birth" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" (click)="closeAddModal()">Cancel</button>
      <button class="btn-save" (click)="submitAddUser()">Create user</button>
    </div>
  </div>
</div>
