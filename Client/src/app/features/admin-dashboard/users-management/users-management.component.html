<div class="management-container">
  <div class="header">
    <h1>Users Management</h1>
    <button class="btn-add">+ Add User</button>
  </div>

  <div *ngIf="errorMessage" class="error-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success-box">{{ successMessage }}</div>

  <div class="table-container">
    <table class="users-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let user of users">
          <tr *ngIf="editingUserId !== user.id">
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span [ngClass]="['badge', getRoleClass(user.role)]">
                {{ user.role }}
              </span>
            </td>
            <td class="actions">
              <button class="btn-edit" (click)="startEdit(user)">Edit</button>
              <button class="btn-delete" (click)="deleteUser(user.id, user.username)">Delete</button>
            </td>
          </tr>

          <tr *ngIf="editingUserId === user.id" class="edit-row">
            <td colspan="4">
              <div class="edit-form">
                <div class="form-group">
                  <label>Username</label>
                  <input type="text" [(ngModel)]="editFormData.username" placeholder="Enter username" />
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input type="email" [(ngModel)]="editFormData.email" placeholder="Enter email" />
                </div>
                <div class="form-group">
                  <label>Password</label>
                  <input type="password" [(ngModel)]="editFormData.password" placeholder="Leave empty to keep current password" />
                </div>
                <div class="form-group">
                  <label>Role</label>
                  <select [(ngModel)]="editFormData.role">
                    <option value="ADMIN">Admin</option>
                    <option value="AGENT">Agent</option>
                    <option value="CLIENT">Client</option>
                  </select>
                </div>
                <div class="form-actions">
                  <button class="btn-save" (click)="saveEdit(user.id)">Save</button>
                  <button class="btn-cancel" (click)="cancelEdit()">Cancel</button>
                </div>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>

  <div *ngIf="users.length === 0 && !errorMessage" class="empty-state">
    <p>No users found.</p>
  </div>
</div>
